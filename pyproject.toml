[project]
name = "litmus-quant"
dynamic = ["version"]
description = "选股条件的证伪器：检验选股条件是否真的有效"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "polars>=1.44.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "litmus/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["litmus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]  # 设计文档里的示例代码不参与格式化

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# 不查「行太长」：代码行的长度由 ruff format 自动处理，这条实际只拦得住长注释
# （中文一个字占两格）。为一行注释多一个字符中断检查、改完再重跑，不值得
ignore = ["E501"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
