[project]
name = "litmus-quant"
dynamic = ["version"]
description = "选股条件的证伪器：检验选股条件是否真的有效"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "polars>=1.44.2",
    "pydantic>=2.13.5",
    "uvicorn>=0.53.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "litmus/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["litmus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]  # 设计文档里的示例代码不参与格式化

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# 不查「行太长」：代码行的长度由 ruff format 自动处理，这条实际只拦得住长注释
# （中文一个字占两格）。为一行注释多一个字符中断检查、改完再重跑，不值得
ignore = ["E501"]

[tool.importlinter]
root_package = "litmus"

# 模块只能向下依赖（ARCHITECTURE §1.2）；research 与 store、data 与 spec 同层、互不依赖。llm 模块出现时
# 加进第三层；「厂商 SDK 只能出现在 llm 模块」那条等 llm 模块出现、装了 SDK 再加
[[tool.importlinter.contracts]]
name = "模块单向依赖"
type = "layers"
layers = [
    "litmus.cli",
    "litmus.api",
    "litmus.research | litmus.store",
    "litmus.signals",
    "litmus.expr",
    "litmus.data | litmus.spec",
]

# 上层只能通过 litmus.data 的公开接口取数，不碰内部子模块（§1.2 第 3 条）。
# 经由 litmus.data 间接用到它们是正常的，所以允许间接引用
[[tool.importlinter.contracts]]
name = "expr 只用 data 的公开接口"
type = "forbidden"
source_modules = ["litmus.expr"]
forbidden_modules = [
    "litmus.data.derive",
    "litmus.data.fields",
    "litmus.data.loaders",
    "litmus.data.manifest",
    "litmus.data.resolve",
    "litmus.data.service",
    "litmus.data.storage",
    "litmus.data.sync",
    "litmus.data.universe",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "research 只用 data、expr、spec 的公开接口"
type = "forbidden"
source_modules = ["litmus.research"]
forbidden_modules = [
    "litmus.data.derive",
    "litmus.data.fields",
    "litmus.data.loaders",
    "litmus.data.manifest",
    "litmus.data.resolve",
    "litmus.data.service",
    "litmus.data.storage",
    "litmus.data.sync",
    "litmus.data.universe",
    "litmus.expr.catalog",
    "litmus.expr.collector",
    "litmus.expr.describer",
    "litmus.expr.evaluator",
    "litmus.expr.operators",
    "litmus.expr.parser",
    "litmus.expr.validator",
    "litmus.spec.assumptions",
    "litmus.spec.defaults",
    "litmus.spec.query_spec",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "signals 只用 data、expr 的公开接口"
type = "forbidden"
source_modules = ["litmus.signals"]
forbidden_modules = [
    "litmus.data.derive",
    "litmus.data.fields",
    "litmus.data.loaders",
    "litmus.data.manifest",
    "litmus.data.resolve",
    "litmus.data.service",
    "litmus.data.storage",
    "litmus.data.sync",
    "litmus.data.universe",
    "litmus.expr.catalog",
    "litmus.expr.collector",
    "litmus.expr.describer",
    "litmus.expr.evaluator",
    "litmus.expr.operators",
    "litmus.expr.parser",
    "litmus.expr.validator",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "api 只用下层模块的公开接口"
type = "forbidden"
source_modules = ["litmus.api"]
forbidden_modules = [
    "litmus.data.derive",
    "litmus.data.fields",
    "litmus.data.loaders",
    "litmus.data.manifest",
    "litmus.data.resolve",
    "litmus.data.service",
    "litmus.data.storage",
    "litmus.data.sync",
    "litmus.data.universe",
    "litmus.expr.catalog",
    "litmus.expr.collector",
    "litmus.expr.describer",
    "litmus.expr.evaluator",
    "litmus.expr.operators",
    "litmus.expr.parser",
    "litmus.expr.validator",
    "litmus.research.history",
    "litmus.research.results",
    "litmus.research.returns",
    "litmus.research.screener",
    "litmus.signals.library",
    "litmus.spec.assumptions",
    "litmus.spec.defaults",
    "litmus.spec.query_spec",
    "litmus.store.base",
    "litmus.store.json_store",
]
allow_indirect_imports = true

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
